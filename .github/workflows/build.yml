name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build and test
        # Only release tags set the plugin version; branch and PR builds stay "dev".
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gradle build -Pversion="${GITHUB_REF_NAME#v}"
          else
            gradle build
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: golden-golem
          path: |
            build/libs/golden-golem.jar
            build/libs/golden-golem-testsupport.jar

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/golden-golem.jar --title "$GITHUB_REF_NAME" --generate-notes

  smoke:
    # Boots a real Paper server with the built jar. The release step lives in `build` and does
    # not wait for this job.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: golden-golem
          path: artifact

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Resolve latest Paper build
        id: paper
        run: scripts/smoke-test.sh resolve

      - name: Cache Paper server jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/paper
          key: paper-26.3-${{ steps.paper.outputs.build }}

      - name: Boot Paper with the plugin
        run: scripts/smoke-test.sh run artifact/golden-golem.jar artifact/golden-golem-testsupport.jar

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-server-log
          path: |
            smoke-server/server.log
            smoke-server/logs/
          if-no-files-found: warn
